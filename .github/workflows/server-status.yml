name: Server status

# Every 30 minutes: check xiv.ffxi.cc from outside, post to Discord (roll call while someone
# is on, and up/down changes), and publish the status page on GitHub Pages.
# History lives on the `status-data` branch, so main gets no commit per run.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "status-page/**"
      - "tools/server_status.py"
      - ".github/workflows/server-status.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: server-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the status history
        run: |
          git fetch --depth=1 origin status-data || true
          if git rev-parse --verify -q origin/status-data >/dev/null; then
            git worktree add data origin/status-data
          else
            git worktree add --detach data
            git -C data checkout --orphan status-data
            git -C data rm -rfq .
          fi

      - name: Check the server
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p site
          cp -r status-page/. site/
          python3 -I tools/server_status.py --data data --site site

      - name: Save the history
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json state.json
          if ! git diff --cached --quiet; then
            git commit -qm "Status at $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:status-data
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
